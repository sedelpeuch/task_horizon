[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskhorizon"
version = "0.1.0"
description = "TaskHorizon: A minimalist Kanban manager for portfolio"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Sébastien Delpeuch", email = "sebastien@delpeuch.net"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "httpx2>=2.4.0",
]

[project.scripts]
taskhorizon = "taskhorizon.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
