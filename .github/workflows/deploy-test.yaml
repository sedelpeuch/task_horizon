name: Deploy Test

on:
  push:
    branches: [master]

concurrency:
  group: deploy-test
  cancel-in-progress: true

env:
  CLUSTER_NAME: task-horizon-eks
  AWS_REGION: eu-west-3
  NAMESPACE: taskhorizon
  RELEASE: taskhorizon-test
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.IMAGE_API }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          target: prod
          push: true
          tags: ${{ env.IMAGE_WEB }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config=envs/test/backend.hcl

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve -var-file=envs/test/terraform.tfvars

      - name: Get kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-credential \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to test
        run: |
          helm upgrade --install ${{ env.RELEASE }} ./helm/taskhorizon \
            -f helm/taskhorizon/values-test.yaml \
            --set auth.jwtSecret=${{ secrets.AUTH_JWT_SECRET }} \
            --set auth.adminPassword=${{ secrets.AUTH_ADMIN_PASSWORD }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --wait
