name: Publish

on:
  push:
    branches: [master]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Compute image tag
      id: tag
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "value=main" >> $GITHUB_OUTPUT
        fi

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: true
        tags: ${{ env.IMAGE_API }}:${{ steps.tag.outputs.value }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Web image (prod target)
      uses: docker/build-push-action@v5
      with:
        context: ./web
        target: prod
        push: true
        tags: ${{ env.IMAGE_WEB }}:${{ steps.tag.outputs.value }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
