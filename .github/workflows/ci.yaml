name: CI

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push API image (tag main)
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: true
        tags: ${{ env.IMAGE_API }}:main
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Web image (tag main, prod target)
      uses: docker/build-push-action@v5
      with:
        context: ./web
        target: prod
        push: true
        tags: ${{ env.IMAGE_WEB }}:main
        cache-from: type=gha
        cache-to: type=gha,mode=max
