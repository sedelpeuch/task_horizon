apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskhorizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "taskhorizon.selectorLabels" (dict "Release" .Release "component" "api") | nindent 4 }}
