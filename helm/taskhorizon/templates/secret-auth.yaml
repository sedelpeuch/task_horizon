{{- if not .Values.auth.existingSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "auth-credentials") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskhorizon.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ required "auth.jwtSecret must be set" .Values.auth.jwtSecret | b64enc | quote }}
  admin-password: {{ required "auth.adminPassword must be set when not using existingSecret" .Values.auth.adminPassword | b64enc | quote }}
{{- end }}
