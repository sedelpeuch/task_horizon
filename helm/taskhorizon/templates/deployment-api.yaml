apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskhorizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taskhorizon.selectorLabels" (dict "Release" .Release "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskhorizon.labels" . | nindent 8 }}
        {{- include "taskhorizon.selectorLabels" (dict "Release" .Release "component" "api") | nindent 8 }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      serviceAccountName: {{ include "taskhorizon.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            {{- if .Values.api.reload }}
            - name: UVICORN_RELOAD
              value: "true"
            {{- end }}
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api-config") }}
                  key: DATABASE_NAME
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api-config") }}
                  key: LOG_LEVEL
            - name: API_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api-config") }}
                  key: API_HOST
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api-config") }}
                  key: API_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskhorizon.dbSecretName" . }}
                  key: {{ .Values.db.existingSecret.usernameKey | default "username" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskhorizon.dbSecretName" . }}
                  key: {{ .Values.db.existingSecret.passwordKey | default "password" }}
            - name: DB_HOST
              value: {{ include "taskhorizon.dbHost" . | quote }}
            # Assemblé depuis les vars ci-dessus — le mot de passe ne touche jamais un ConfigMap
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):{{ .Values.postgres.port }}/$(DATABASE_NAME)"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.auth.existingSecret.enabled }}{{ .Values.auth.existingSecret.name }}{{ else }}{{ include "taskhorizon.componentName" (dict "Release" .Release "component" "auth-credentials") }}{{ end }}
                  key: {{ .Values.auth.existingSecret.jwtSecretKey | default "jwt-secret" }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.auth.existingSecret.enabled }}{{ .Values.auth.existingSecret.name }}{{ else }}{{ include "taskhorizon.componentName" (dict "Release" .Release "component" "auth-credentials") }}{{ end }}
                  key: {{ .Values.auth.existingSecret.adminPasswordKey | default "admin-password" }}
            - name: JWT_EXPIRE_HOURS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api-config") }}
                  key: JWT_EXPIRE_HOURS
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api-config") }}
                  key: ADMIN_EMAIL
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
