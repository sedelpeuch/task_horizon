apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskhorizon.componentName" (dict "Release" .Release "component" "web-nginx-config") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskhorizon.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.web.port }};
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://{{ include "taskhorizon.componentName" (dict "Release" .Release "component" "api") }}:{{ .Values.api.port }};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
      }

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
      }

      location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
      }
    }
