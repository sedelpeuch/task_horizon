api:
  replicaCount: 3
  reload: false
  env:
    LOG_LEVEL: warning
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 2

web:
  replicaCount: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

postgres:
  enabled: false

db:
  name: taskhorizon
  user: ''
  password: ''
  existingSecret:
    enabled: true
    name: taskhorizon-prod-rds-credentials
    passwordKey: password
    usernameKey: username
  externalHost: taskhorizon.xxxxxxxxxxxx.eu-west-1.rds.amazonaws.com

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  host: taskhorizon.example.com
  tls:
    enabled: true
    secretName: taskhorizon-prod-tls
